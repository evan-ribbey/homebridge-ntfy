name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Mirrors the node versions declared in package.json engines,
        # which in turn track what Homebridge 2.x supports
        node-version: ['22', '24', '26']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # Dependency caching is deliberately off: the runner cannot reach the
          # Gitea cache server, so every restore attempt times out and costs
          # more than the install it was meant to save. setup-node v5+ can turn
          # caching on by itself, so it is switched off explicitly.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Only the dependencies that ship to plugin users gate the build; dev
      # tooling advisories are left to Renovate. This is what would have caught
      # axios sitting on a release with known high-severity advisories.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the publishable package
        run: npm pack --dry-run
