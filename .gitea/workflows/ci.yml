name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Mirrors the node versions declared in package.json engines,
        # which in turn track what Homebridge 2.x supports
        node-version: ['22', '24', '26']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Dependency caching is deliberately off: the runner cannot reach the
          # Gitea cache server, so every restore attempt times out and costs
          # more than the install it was meant to save.

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the publishable package
        run: npm pack --dry-run
